name: dollchecker
description: DollChecker — AI toy analyzer and parenting assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management (no codegen — manual providers)
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Camera / image
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Charts
  fl_chart: ^0.68.0

  # Misc
  intl: any
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from l10n.yaml
  assets:
    - .env
