name: dollchecker
description: DollChecker — AI toy analyzer and parenting assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management (no codegen — manual providers)
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Camera / image
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Charts
  fl_chart: ^0.68.0

  # Local notifications (no FCM/APNs account needed, works offline).
  # Pinned below 19: that release removed the required
  # `uiLocalNotificationDateInterpretation` argument of `zonedSchedule`, so the
  # call below cannot satisfy both sides of that boundary. Widening this range
  # means editing reminder_scheduler.dart in the same commit.
  flutter_local_notifications: ">=17.0.0 <19.0.0"
  timezone: ">=0.9.0 <0.11.0"
  shared_preferences: ^2.2.0

  # Misc
  intl: any
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the launcher icons from assets/icon/. Run after `flutter create`:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ">=0.13.0 <0.15.0"

# Source artwork lives in assets/icon/ and is read by the generator above, not
# bundled into the app — nothing loads it at runtime.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#4C6EF5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  # iOS rejects an icon with an alpha channel.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from l10n.yaml
  assets:
    - .env
