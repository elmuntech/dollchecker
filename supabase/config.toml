# Supabase project config. Run `supabase link --project-ref <ref>` first.
project_id = "dollchecker"

[functions.analyze-toy]
# The function verifies the JWT itself and also relies on platform verification.
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.polar-billing]
verify_jwt = true

[functions.polar-webhook]
# Polar is not a Supabase user and sends no JWT. The Standard Webhooks
# signature check inside the function authenticates the caller instead.
verify_jwt = false
