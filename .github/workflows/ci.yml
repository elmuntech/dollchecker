name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Pinned so a new stable release cannot redden CI on an unrelated PR via
      # fresh deprecation infos. Bump deliberately.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # Also runs gen-l10n, so the generated AppLocalizations exists before
      # analysis. The generated files are not committed.
      - name: Install dependencies
        run: flutter pub get

      - name: Verify ARB files are valid JSON
        run: |
          for f in lib/l10n/*.arb; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # The lockfile belongs in the repository (see .gitignore), but it can
      # only be produced by a resolver. Until it is committed, this is where
      # to get one: download it, drop it in app/, commit it. Once it is
      # tracked, `flutter pub get` above honours it and this artifact just
      # confirms it did not change.
      - name: Upload resolved pubspec.lock
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # android/ and ios/ are not committed, so the build starts from a
      # freshly generated project — which is also what proves that
      # tool/configure_platform.py still applies cleanly to it.
      #
      # iOS is generated too even though only Android is built here: the icon
      # set covers both platforms, and it means the script's Info.plist and
      # Xcode-project edits are exercised on every PR rather than only on
      # somebody's Mac.
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --project-name dollchecker .

      - name: Apply platform configuration
        run: python3 ../tool/configure_platform.py .

      # Also proves the flutter_launcher_icons config and the generated artwork
      # still produce a valid icon set.
      - name: Launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      # Debug rather than release: signing keys are not in CI. This still
      # compiles every plugin's native code, which `flutter test` never does.
      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: dollchecker-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check supabase/functions/

      # index.ts pulls supabase-js from a CDN; the pure modules type-check
      # without any network fetch, and `deno test` covers them end to end.
      - name: Type check
        run: |
          deno check \
            supabase/functions/analyze-toy/utils.ts \
            supabase/functions/analyze-toy/schema.ts \
            supabase/functions/analyze-toy/prompt.ts \
            supabase/functions/chat-toy/utils.ts \
            supabase/functions/delete-account/utils.ts \
            supabase/functions/polar-billing/utils.ts \
            supabase/functions/polar-webhook/utils.ts \
            supabase/functions/_shared/cors.ts \
            supabase/functions/_shared/rate_limit.ts

      - name: Test
        run: deno test supabase/functions/
